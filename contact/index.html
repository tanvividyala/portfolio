<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Tanvi Vidyala</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@300;400;500&display=swap">
    <script src="../global.js" type="module"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📺</text></svg>">
</head>
<body>
    <div class="page-hero">
        <p class="page-eyebrow">LET'S TALK</p>
        <h1 class="page-title">Contact Me</h1>
        <p class="page-subtitle">Have a question, an opportunity, or just want to say hi? Drop me a note.</p>
    </div>

    <div class="contact-card glass">
        <form action="mailto:tvidyala@ucsd.edu" method="get">
            <label class="field">
                <span class="field__label">Subject</span>
                <input class="field__input" name="subject">
            </label>
            <label class="field">
                <span class="field__label">Message</span>
                <textarea class="field__input" name="body" rows="5"></textarea>
            </label>
            <button class="btn btn--primary">send the note <span class="arrow">→</span></button>
        </form>
    </div>
</body>
</html>
