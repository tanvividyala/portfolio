<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="sun-logo-title">
  <title id="sun-logo-title">Smiling sun with T and V for eyes</title>

  <defs>
    <!-- One ray: a broad wedge whose base is nearly as wide as the 30 degrees
         it owns, so neighbouring rays leave only a shallow notch between them.
         Round joins soften the tip and the two base corners; the base itself
         tucks under the disc. -->
    <path id="sun-ray" fill="#e2645d" stroke="#e2645d" stroke-width="10" stroke-linejoin="round"
          d="M -19 -60 L 0 -104 L 19 -60 Z"/>
  </defs>

  <g transform="translate(128 128)">
    <!-- Twelve rays -->
    <use href="#sun-ray"/>
    <use href="#sun-ray" transform="rotate(30)"/>
    <use href="#sun-ray" transform="rotate(60)"/>
    <use href="#sun-ray" transform="rotate(90)"/>
    <use href="#sun-ray" transform="rotate(120)"/>
    <use href="#sun-ray" transform="rotate(150)"/>
    <use href="#sun-ray" transform="rotate(180)"/>
    <use href="#sun-ray" transform="rotate(210)"/>
    <use href="#sun-ray" transform="rotate(240)"/>
    <use href="#sun-ray" transform="rotate(270)"/>
    <use href="#sun-ray" transform="rotate(300)"/>
    <use href="#sun-ray" transform="rotate(330)"/>

    <!-- Disc: about two thirds of the full width, the way the reference sits -->
    <circle r="70" fill="#f2bb4d"/>

    <!-- The whole face sits a touch below centre, scaled with the bigger disc -->
    <g transform="translate(0 7) scale(1.1)">
      <!-- Eyes: the initials, drawn as shapes so they never rely on a font -->
      <g fill="#2e1a16">
        <rect x="-40" y="-30" width="28" height="9" rx="1.5"/>
        <rect x="-30.5" y="-30" width="9" height="32" rx="1.5"/>
      </g>
      <!-- Path is inset by half the stroke width so the V ends up the same
           28 x 32 as the T, rather than the caps making it look bigger. -->
      <path d="M 16.5 -25.5 L 26 -2.5 L 35.5 -25.5" fill="none" stroke="#2e1a16" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Smile -->
      <path d="M -21 18 Q 0 37 21 18" fill="none" stroke="#2e1a16" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
