<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="tv-mark-title">
  <title id="tv-mark-title">Retro TV mark</title>

  <defs>
    <g id="mark-petal">
      <path fill="#e2645d" d="M0 0 L13.13 -18.86 A16 16 0 1 0 -13.13 -18.86 Z"/>
      <path fill="#eda23e" transform="scale(0.68)" d="M0 0 L13.13 -18.86 A16 16 0 1 0 -13.13 -18.86 Z"/>
      <path fill="#f2e3bd" transform="scale(0.42)" d="M0 0 L13.13 -18.86 A16 16 0 1 0 -13.13 -18.86 Z"/>
    </g>
  </defs>

  <!-- antennae -->
  <g stroke="#aab6bf" stroke-width="3" stroke-linecap="round">
    <path d="M30 20 L14 7"/>
    <path d="M34 20 L50 7"/>
  </g>
  <circle cx="14" cy="6" r="3" fill="#c5ced5"/>
  <circle cx="50" cy="6" r="3" fill="#c5ced5"/>

  <!-- cabinet -->
  <rect x="3" y="16" width="58" height="40" rx="10" fill="#e2645d"/>

  <!-- screen: one bloom, scaled to fit -->
  <rect x="7" y="21" width="36" height="30" rx="7" fill="#3a2420"/>
  <rect x="9" y="23" width="32" height="26" rx="5" fill="#6b3a35"/>
  <g transform="translate(25 36) scale(0.30)">
    <use href="#mark-petal"/>
    <use href="#mark-petal" transform="rotate(90)"/>
    <use href="#mark-petal" transform="rotate(180)"/>
    <use href="#mark-petal" transform="rotate(270)"/>
    <circle r="8" fill="#5c2b26"/>
    <circle r="5" fill="#e2645d"/>
  </g>

  <!-- dials -->
  <circle cx="52" cy="30" r="5" fill="#c5ced5"/>
  <circle cx="52" cy="30" r="2" fill="#8d9aa4"/>
  <circle cx="52" cy="44" r="5" fill="#c5ced5"/>
  <circle cx="52" cy="44" r="2" fill="#8d9aa4"/>

  <!-- feet -->
  <path d="M12 56 h9 l-2 6 h-5 Z" fill="#c14f48"/>
  <path d="M43 56 h9 l-2 6 h-5 Z" fill="#c14f48"/>
</svg>
